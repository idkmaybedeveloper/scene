[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
apple-codesign = { version = "0.29", default-features = false }
clap = { version = "4.6", features = ["derive"] }
bad64 = "0.13"
iced-x86 = { version = "1.22", default-features = false, features = ["std", "decoder", "encoder", "block_encoder", "instr_info", "intel"] }
object = { version = "0.41", default-features = false, features = ["std", "read"] }

scene-disasm = { path = "crates/disasm" }
scene-asm = { path = "crates/asm" }

[package]
name = "scene"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
object.workspace = true
scene-disasm.workspace = true
scene-asm.workspace = true
apple-codesign.workspace = true