[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
apple-codesign = { version = "0.29", default-features = false }
clap = { version = "4.6", features = ["derive"] }
bad64 = "0.13"
iced-x86 = { version = "1.22", default-features = false, features = ["std", "decoder", "encoder", "block_encoder", "instr_info", "intel"] }
object = { version = "0.41", default-features = false, features = ["std", "read", "build"] }

scene-disasm = { path = "crates/disasm" }
scene-asm = { path = "crates/asm" }
scene-passes = { path = "crates/passes" }

[package]
name = "scene"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
bad64.workspace = true
iced-x86.workspace = true
clap.workspace = true
object.workspace = true
scene-disasm.workspace = true
scene-asm.workspace = true
scene-passes.workspace = true
apple-codesign.workspace = true
leb128 = "0.2"
getrandom = "0.2.17"
gimli = "0.34"
